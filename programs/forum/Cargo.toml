[package]
name = "holder-forum"
version = "0.1.0"
description = "Per-token holder forum: ids on Solana/MagicBlock, bodies on Arweave"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "holder_forum"

# Full Anchor feature set so macros' cfg checks stop warning (Solana Foundation
# Anchor v1 migration §7 + MagickBlock/bolt program Cargo.toml pattern).
[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = ["anchor-lang/anchor-debug"]
custom-heap = []
custom-panic = []

[dependencies]
# MagicBlock's documented stack (Anchor guide + ephemeral-rollups-sdk 0.16).
# See forum/README.md. Pin these when you `anchor build`.
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = "1.0.2"
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor"] }
bytemuck = { version = "1.20.0", features = ["min_const_generics"] }
